<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Educativa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <!-- CONTENEDOR DE LOGIN MINIMALISTA -->
  <div id="login-container" class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm border p-4 w-100" style="max-width: 420px;">
      <div class="text-center mb-4">
        <h2 class="h4 fw-bold mb-1">Gestión Educativa</h2>
        <p class="text-muted small mb-0">Seleccione un perfil e ingrese su contraseña</p>
      </div>

      <!-- BOTONES DE SELECCIÓN DE USUARIO -->
      <div class="mb-3">
        <label class="form-label small text-muted d-block text-center mb-2">Seleccionar perfil rápido:</label>
        <div class="row g-2">
          <div class="col-6">
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 py-2 quick-user-btn" data-user="admin">
              Administrador
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 py-2 quick-user-btn" data-user="secretaria">
              Secretaría
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 py-2 quick-user-btn" data-user="docente">
              Docente
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn btn-outline-secondary btn-sm w-100 py-2 quick-user-btn" data-user="alumno">
              Alumno
            </button>
          </div>
        </div>
      </div>

      <hr class="my-3 text-muted opacity-25">

      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label small">Usuario</label>
          <input type="text" class="form-control" id="username" placeholder="Usuario" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Contraseña" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger d-none py-2 small" role="alert"></div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL (DASHBOARD MINIMALISTA) -->
  <div id="app-container" class="d-none min-vh-100 d-flex flex-column">
    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <a class="navbar-brand fw-bold" href="#" id="app-title">Gestión Escolar</a>
      <div class="ms-auto d-flex align-items-center">
        <span class="text-light me-3 small" id="user-display-info">Rol: -</span>
        <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </nav>

    <div class="container-fluid flex-grow-1 d-flex">
      <div class="row flex-grow-1 w-100 m-0">
        <!-- Sidebar Dinámico -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar border-end py-3">
          <div class="position-sticky">
            <ul id="sidebar-menu" class="nav flex-column gap-1">
              <!-- Se inyecta dinámicamente -->
            </ul>
          </div>
        </nav>

        <!-- Área de Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="main-content-area">
          <!-- Banner de Bienvenida -->
          <div id="welcome-banner" class="alert alert-light border shadow-sm mb-4 d-flex justify-content-between align-items-center">
            <div>
              <h5 class="fw-bold mb-1" id="welcome-title">Bienvenido/a</h5>
              <p class="text-muted small mb-0" id="welcome-subtitle">Plataforma Institucional de Gestión Escolar</p>
            </div>
            <span class="badge badge-soft-dark small px-3 py-2" id="current-date-badge"></span>
          </div>

          <!-- Contenido dinámico de las vistas -->
          <div id="view-content"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- MODAL GENÉRICO PARA FORMULARIOS -->
  <div class="modal fade" id="crudModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crudModalLabel">Registro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="crudForm">
            <div id="modalFormFields"></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER PARA NOTIFICACIONES FLOTANTES -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center text-white bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">
          Acción completada con éxito.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Scripts de la aplicación -->
  <script src="js/config.js"></script>
  <script src="js/mockApi.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
