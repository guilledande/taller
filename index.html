<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegio San Martín - Sistema Escolar</title>
    <!-- Importamos Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 480px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">🏫 Colegio San Martín</h3>
            <p class="text-muted small">Sistema de Gestión Escolar - Ciclo Lectivo 2026</p>
        </div>

        <!-- Botones de Acceso Directo por Rol Escolar -->
        <div class="d-grid gap-3">
            <button class="btn btn-outline-dark py-2 fw-semibold text-start px-3 d-flex justify-content-between align-items-center" onclick="ingresarComo('admin')">
                <span>👑 Dirección / Administrador</span>
                <span class="badge bg-dark">Gestión Total</span>
            </button>

            <button class="btn btn-outline-primary py-2 fw-semibold text-start px-3 d-flex justify-content-between align-items-center" onclick="ingresarComo('secretaria')">
                <span>💼 Secretaría Escolar</span>
                <span class="badge bg-primary">Inscripciones y Cuotas</span>
            </button>

            <button class="btn btn-outline-success py-2 fw-semibold text-start px-3 d-flex justify-content-between align-items-center" onclick="ingresarComo('docente')">
                <span>👨‍🏫 Docentes / Preceptores</span>
                <span class="badge bg-success">Notas y Asistencias</span>
            </button>

            <button class="btn btn-outline-secondary py-2 fw-semibold text-start px-3 d-flex justify-content-between align-items-center" onclick="ingresarComo('alumno')">
                <span>🎓 Alumnos y Tutores</span>
                <span class="badge bg-secondary">Boletín y Estado</span>
            </button>
        </div>
    </div>

    <!-- Script de lógica de redirección -->
    <script>
        function ingresarComo(rol) {
            if (rol === 'docente') {
                window.location.href = 'dashboard-docente.html';
            } else if (rol === 'secretaria') {
                window.location.href = 'dashboard-secretaria.html';
            } else if (rol === 'admin') {
                window.location.href = 'dashboard-admin.html';
            } else if (rol === 'alumno') {
                window.location.href = 'dashboard-alumno.html';
            }
        }
    </script>
</body>
</html>
